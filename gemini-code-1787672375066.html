<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Impressão 3D</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #4caf50; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 14px; margin-bottom: 5px; color: #bbb; }
        input { padding: 10px; border: 1px solid #333; border-radius: 4px; background: #2c2c2c; color: #fff; font-size: 16px; }
        input:focus { outline: none; border-color: #4caf50; }
        button { width: 100%; padding: 15px; background: #4caf50; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .results { margin-top: 30px; display: none; }
        .results-card { background: #2c2c2c; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #4caf50; }
        .results-card h3 { margin-top: 0; color: #fff; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .highlight { font-weight: bold; color: #4caf50; font-size: 18px; }
        .info-row { color: #888; font-size: 14px; margin-bottom: 10px; text-align: center; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: center; padding: 10px; border: 1px solid #444; }
        th { background: #333; color: #4caf50; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora 3D - Custos e Vendas</h1>
    
    <div class="grid">
        <div class="input-group">
            <label>Altura da Peça (cm)</label>
            <input type="number" id="altura" value="5" step="0.1">
        </div>
        <div class="input-group">
            <label>Largura da Peça (cm)</label>
            <input type="number" id="largura" value="5" step="0.1">
        </div>
        <div class="input-group">
            <label>Preço do Filamento (R$/kg)</label>
            <input type="number" id="precoFilamento" value="120" step="0.01">
        </div>
        <div class="input-group">
            <label>Peso da Peça (g)</label>
            <input type="number" id="peso" value="12" step="1">
        </div>
        <div class="input-group">
            <label>Tempo de Impressão (Horas)</label>
            <input type="number" id="tempo" value="0.5" step="0.1">
        </div>
        <div class="input-group">
            <label>Consumo da Impressora (W)</label>
            <input type="number" id="potencia" value="250" step="1">
        </div>
        <div class="input-group">
            <label>Valor do kWh (R$)</label>
            <input type="number" id="kwh" value="0.95" step="0.01">
        </div>
        <div class="input-group">
            <label>Valor da Impressora (R$)</label>
            <input type="number" id="valorMaquina" value="1500" step="1">
        </div>
        <div class="input-group">
            <label>Insumos/Acabamento (Argola, caixa. R$)</label>
            <input type="number" id="insumos" value="0.25" step="0.01">
        </div>
        <div class="input-group">
            <label>Margem de Falha (%)</label>
            <input type="number" id="falha" value="10" step="1">
        </div>
    </div>

    <button onclick="calcular()">Calcular Custos e Preços</button>

    <div id="results" class="results">
        <h2>Resumo da Produção</h2>
        <div class="info-row" id="outDimensoes"></div>
        
        <div class="grid">
            <div class="results-card">
                <h3>Custo de Produção (Unitário)</h3>
                <div class="row"><span>Material:</span> <span id="outMaterial"></span></div>
                <div class="row"><span>Energia:</span> <span id="outEnergia"></span></div>
                <div class="row"><span>Depreciação:</span> <span id="outDepreciacao"></span></div>
                <div class="row"><span>Insumos Extras:</span> <span id="outInsumos"></span></div>
                <div class="row"><span>Margem de Falha:</span> <span id="outFalha"></span></div>
                <div class="row highlight"><span style="color:#fff">Custo Total:</span> <span id="outCustoTotal"></span></div>
            </div>
        </div>

        <h2>Estratégia de Venda Recomendada</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Pacote</th>
                        <th>Preço Sugerido (Unidade)</th>
                        <th>Preço Final (Pacote)</th>
                        <th>Seu Lucro Limpo</th>
                    </tr>
                </thead>
                <tbody id="tabelaVendas">
                    <!-- Gerado via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function calcular() {
        // Puxando valores
        const altura = parseFloat(document.getElementById('altura').value);
        const largura = parseFloat(document.getElementById('largura').value);
        const precoFilamento = parseFloat(document.getElementById('precoFilamento').value);
        const peso = parseFloat(document.getElementById('peso').value);
        const tempo = parseFloat(document.getElementById('tempo').value);
        const potencia = parseFloat(document.getElementById('potencia').value);
        const kwh = parseFloat(document.getElementById('kwh').value);
        const valorMaquina = parseFloat(document.getElementById('valorMaquina').value);
        const insumos = parseFloat(document.getElementById('insumos').value);
        const falha = parseFloat(document.getElementById('falha').value);

        // Atualizando info das dimensões
        document.getElementById('outDimensoes').innerText = `Tamanho da Peça: ${altura} cm (Altura) x ${largura} cm (Largura)`;

        // Cálculos
        const custoMaterial = (peso / 1000) * precoFilamento;
        const custoEnergia = (potencia / 1000) * tempo * kwh;
        const vidaUtilHoras = 4000;
        const custoDepreciacao = (valorMaquina / vidaUtilHoras) * tempo;
        
        const subTotal = custoMaterial + custoEnergia + custoDepreciacao + insumos;
        const valorFalha = subTotal * (falha / 100);
        const custoTotal = subTotal + valorFalha;

        // Custos formatados
        document.getElementById('outMaterial').innerText = `R$ ${custoMaterial.toFixed(2)}`;
        document.getElementById('outEnergia').innerText = `R$ ${custoEnergia.toFixed(2)}`;
        document.getElementById('outDepreciacao').innerText = `R$ ${custoDepreciacao.toFixed(2)}`;
        document.getElementById('outInsumos').innerText = `R$ ${insumos.toFixed(2)}`;
        document.getElementById('outFalha').innerText = `R$ ${valorFalha.toFixed(2)}`;
        document.getElementById('outCustoTotal').innerText = `R$ ${custoTotal.toFixed(2)}`;

        // Estratégia
        const vendas = [
            { qtd: 1, nome: "1 Unidade (Avulso)", mult: 3.5 },
            { qtd: 20, nome: "Pacote 20 un.", mult: 2.5 },
            { qtd: 70, nome: "Pacote 70 un.", mult: 2.1 },
            { qtd: 100, nome: "Pacote 100 un.", mult: 1.8 }
        ];

        let tabelaHTML = "";
        
        vendas.forEach(venda => {
            let precoUnitario = custoTotal * venda.mult;
            precoUnitario = Math.ceil(precoUnitario * 10) / 10; 
            
            let precoPacote = precoUnitario * venda.qtd;
            let custoPacote = custoTotal * venda.qtd;
            let lucro = precoPacote - custoPacote;

            tabelaHTML += `
                <tr>
                    <td><strong>${venda.nome}</strong></td>
                    <td>R$ ${precoUnitario.toFixed(2)}</td>
                    <td><strong>R$ ${precoPacote.toFixed(2)}</strong></td>
                    <td style="color:#4caf50; font-weight:bold;">R$ ${lucro.toFixed(2)}</td>
                </tr>
            `;
        });

        document.getElementById('tabelaVendas').innerHTML = tabelaHTML;
        document.getElementById('results').style.display = 'block';
    }
</script>
</body>
</html>
